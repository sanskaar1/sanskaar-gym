<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanskaar GYM">
<title>Sanskaar GYM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#1c2027;--line:#262b33;--text:#eef0f3;--muted:#8b929c;--acc:#ffd60a;--accInk:#0b0d10;--red:#ff6161;--gold:#ff9f43;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 2px 10px}
h3{font-size:19px}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand b{color:var(--acc)}
.sync-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:99px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--acc)}.dot.warn{background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px}.wrap-row{flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--card2);border:1px solid var(--line);transition:transform .08s,background .2s;text-decoration:none;color:var(--text);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);background:transparent;border-color:#3a2326}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%;margin-top:10px}
.icon{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);background:var(--card2);border:1px solid var(--line)}
.icon svg{width:18px;height:18px}
.icon.on{color:var(--accInk);background:var(--acc);border-color:var(--acc)}
.in,select.in,textarea.in{width:100%;height:44px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:none}
textarea.in{height:auto;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--acc)}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
label.f .in{margin-top:6px;color:var(--text);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:12px 0}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(255,214,10,.12);color:var(--acc);white-space:nowrap}
.chip.ghost{background:var(--card2);color:var(--muted)}
.btnchip{font-size:13px;padding:8px 14px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.btnchip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(255,214,10,.18),transparent 55%),var(--card);padding:22px}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tile .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.plan-card{display:flex;align-items:center;gap:12px}
.plan-card .grow{flex:1;min-width:0}
.plan-card .nm{font-weight:700;font-size:17px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* active workout */
.title-in{background:transparent;border:0;outline:none;font-size:24px;font-weight:800;letter-spacing:-.03em;width:100%;padding:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.ex{padding:14px}
.ex.complete{border-color:rgba(255,214,10,.45)}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-weight:700;font-size:17px}
.ex-tools{display:flex;gap:6px;flex-shrink:0}
.vid{margin:12px 0 4px}
.frame{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:8px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sets{margin-top:12px}
.set-row{display:grid;grid-template-columns:34px 1fr 72px 64px 44px;gap:8px;align-items:center;padding:4px 0;border-radius:10px;transition:background .2s}
.set-row.hd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding-bottom:2px}
.set-row.hd span:nth-child(n+3){text-align:center}
.set-row .sn{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--card2);font-weight:700;font-size:13px}
.set-row .prev{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set-row input{height:40px;width:100%;text-align:center;border-radius:10px;background:var(--card2);border:1px solid var(--line);outline:none;font-weight:600;font-variant-numeric:tabular-nums}
.set-row input:focus{border-color:var(--acc)}
.set-row input::placeholder{color:#5c636d}
.chk{width:40px;height:40px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.set-row.done{background:rgba(255,214,10,.07)}
.set-row.done .chk{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.set-row.done .sn{background:var(--acc);color:var(--accInk)}
.set-row.done input{background:transparent;border-color:transparent}
.ex-foot{display:flex;gap:8px;margin-top:10px}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.pick{width:100%;text-align:left}
.vdot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
.vdot.on{background:#ff4e45}
.plan-item{display:grid;grid-template-columns:1fr 56px 74px 36px 36px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-item:last-child{border-bottom:0}
.plan-item input{height:38px;text-align:center;border-radius:10px;background:var(--card2);border:1px solid var(--line);width:100%;outline:none}
/* charts */
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart .ax{fill:var(--muted);font-size:10px;font-family:Inter,sans-serif}
.chart .hi{fill:var(--text);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
details.w{border-bottom:1px solid var(--line);padding:12px 2px}
details.w:last-child{border-bottom:0}
details.w summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.w summary::-webkit-details-marker{display:none}
.wd{margin-top:10px;font-size:13.5px}
.wd .e{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:var(--muted)}
.wd .e b{color:var(--text);font-weight:600}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--gold)}.delta.down{color:var(--acc)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,16,20,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in-nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc)}
/* rest timer */
.restbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:29;width:min(608px,calc(100% - 32px));background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.restbar.hidden{display:none}
.rb-fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,214,10,.13);transition:width 1s linear}
.restbar>*:not(.rb-fill){position:relative}
.rb-time{flex:1;text-align:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.rb-time small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:41;width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet label.f{margin-top:12px}
.pr{display:flex;gap:10px;align-items:center;background:rgba(255,159,67,.1);border:1px solid rgba(255,159,67,.3);color:var(--gold);padding:10px 12px;border-radius:12px;margin-top:8px;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.steps{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.steps li{margin:6px 0}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:12.5px}
.top-r{display:flex;align-items:center;gap:8px}
.gear{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;color:var(--muted);background:var(--card);border:1px solid var(--line)}
.gear svg{width:18px;height:18px}
/* settings: grouped rows */
.page-h{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.page-h h3{font-size:24px;font-weight:800}
.gh{font-size:12px;font-weight:600;color:var(--muted);margin:22px 6px 8px;text-transform:uppercase;letter-spacing:.08em}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,214,10,.12);color:var(--acc);flex-shrink:0}
.srow .ic.n{background:var(--card2);color:var(--muted)}
.srow .ic svg{width:18px;height:18px}
.srow .grow{flex:1;min-width:0}
.srow .t{font-weight:600}
.srow .s{font-size:12px;color:var(--muted);margin-top:2px}
.srow .chev{color:#59606a;width:16px;height:16px;flex-shrink:0}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{height:30px;min-width:44px;padding:0 10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--accInk)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:17px}
.stepper span{min-width:46px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.mini-in{width:72px;height:36px;text-align:center;border-radius:10px;background:var(--card2);border:1px solid var(--line);outline:none;font-weight:700}
.mini-in:focus{border-color:var(--acc)}
details.adv{margin-top:22px}
details.adv summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:0 6px 8px;display:flex;align-items:center;gap:6px}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary svg{width:14px;height:14px;transition:transform .2s}
details.adv[open] summary svg{transform:rotate(90deg)}
.foot{text-align:center;color:#59606a;font-size:12px;margin-top:26px}
/* session comparison */
.cmp-head{margin-top:14px;padding:14px;border-radius:14px;background:radial-gradient(120% 160% at 0% 0%,rgba(255,214,10,.2),transparent 60%),var(--card2);border:1px solid rgba(255,214,10,.3)}
.cmp-head.flat{background:var(--card2);border-color:var(--line)}
.cmp-head .big{font-size:20px;font-weight:800;letter-spacing:-.02em}
.tile .d{font-size:11.5px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.better{color:var(--acc)}.lower{color:var(--muted)}
.cmp-ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.cmp-ex:last-child{border-bottom:0}
.cmp-ex .n{font-weight:600;font-size:14px}
.cmp-ex .x{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.cmp-ex .r{text-align:right;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp-ex .r small{display:block;font-size:11.5px;font-weight:600}
@media (max-width:380px){.set-row{grid-template-columns:28px 1fr 62px 54px 40px;gap:6px}.tiles{gap:6px}.tile .v{font-size:19px}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand">Sanskaar <b>GYM</b></div><div class="top-r"><button class="sync-pill" data-a="go-settings" id="syncPill"></button><button class="gear" data-a="go-settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div></div></div>
<main class="wrap" id="view"></main>

<div class="restbar hidden" id="restbar">
  <div class="rb-fill" id="rbFill"></div>
  <button class="btn sm" data-a="rest-sub">−15</button>
  <div class="rb-time"><small>Rest</small><span id="rbTime">0:00</span></div>
  <button class="btn sm" data-a="rest-add">+15</button>
  <button class="btn sm acc" data-a="rest-skip">Skip</button>
</div>

<nav class="tabs"><div class="in-nav" id="nav"></div></nav>
<div class="scrim" id="scrim" data-a="close"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
'use strict';
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const r1 = n => Math.round(n * 10) / 10;
const fmtN = n => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(Math.round(n));
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const nice = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const short = t => new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}` : `${m}:${String(x).padStart(2,'0')}`; };
const e1rm = (w, r) => r <= 0 ? 0 : r === 1 ? w : w * (1 + r / 30); // Epley
const weekStart = t => { const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };
const ytId = url => { if (!url) return ''; const m = String(url).match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(url.trim()) ? url.trim() : ''); };

const IC = {
  workout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
  plans:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>',

const KEY = 'forge.v1';
function seed() {

    ['Barbell Bench Press','Chest'],['Incline Dumbbell Press','Chest'],['Cable Fly','Chest'],['Push-Up','Chest'],['Dips','Chest'],
    ['Deadlift','Back'],['Pull-Up','Back'],['Lat Pulldown','Back'],['Barbell Row','Back'],['Seated Cable Row','Back'],['Face Pull','Back'],
    ['Back Squat','Legs'],['Leg Press','Legs'],['Bulgarian Split Squat','Legs'],['Leg Curl','Legs'],['Leg Extension','Legs'],['Standing Calf Raise','Legs'],

    ['Treadmill','Cardio'],['Rowing Machine','Cardio'],
  ].map(([name, muscle]) => ({ id: uid(), name, muscle, video: '' }));
  const by = n => lib.find(e => e.name === n).id;

  return {

    plans: [
      P('Push', [['Barbell Bench Press',4,'6-8'],['Incline Dumbbell Press',3,'8-10'],['Overhead Press',3,'6-8'],['Dumbbell Lateral Raise',3,'12-15'],['Tricep Pushdown',3,'10-12']]),
      P('Pull', [['Deadlift',3,'5'],['Pull-Up',3,'6-10'],['Barbell Row',3,'8-10'],['Face Pull',3,'15'],['Barbell Curl',3,'10-12']]),
      P('Legs', [['Back Squat',4,'5-8'],['Romanian Deadlift',3,'8-10'],['Leg Press',3,'10-12'],['Leg Curl',3,'12'],['Standing Calf Raise',4,'12-15']]),
    ],
    workouts: [], body: [], deleted: [], active: null,

}
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.library) return Object.assign(seed(), d); } catch (e) {} return seed(); }
let S = load();
// Your data lives in your Google Sheet; every request carries the private key saved on this device
const SHEET_API = 'https://script.google.com/macros/s/AKfycbx5Bg43CHGv6oGRzVm3Qb6eR_vfLK_vWWcOp8-spWW1noc9fUHnOwgXj3CHujAr-dP6_Q/exec';
const KEY_STORE = 'sgym.key';
let apiKey = ''; try { apiKey = localStorage.getItem(KEY_STORE) || ''; } catch (e) {}
const connected = () => !!apiKey;
async function api(action, data, key = apiKey) {
  const res = await fetch(SHEET_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key, action, data }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'failed');
  return j;
}
// Don't push to the Sheet until its copy has been checked, so a stale device can't overwrite it
let cloudT, cloudReady = false;
function save() {
  S.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (connected() && cloudReady) { clearTimeout(cloudT); cloudT = setTimeout(() => api('save', JSON.stringify(S)).catch(() => {}), 2500); }
}
async function pullCloud(force) {
  try {
    const { result } = await api('load');
    const d = result ? JSON.parse(result) : null;
    if (d && d.library && (force || (d.savedAt || 0) > (S.savedAt || 0))) {
      S = Object.assign(seed(), d);
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      render(); if (S.active) keepAwake(true);
    }
  } finally { cloudReady = true; }
}

const lib = id => S.library.find(e => e.id === id) || { id, name: 'Deleted exercise', muscle: 'Other', video: '' };
const unit = () => S.settings.unit;
const lenUnit = () => unit() === 'kg' ? 'cm' : 'in';
const sorted = () => [...S.workouts].sort((a, b) => b.start - a.start);

function prevSets(exId) {
  for (const w of sorted()) { const e = w.exercises.find(x => x.exId === exId); if (e) return e.sets; }
  return [];
}
function bestE1(exId, skipId) {
  let b = 0;
  for (const w of S.workouts) if (w.id !== skipId) for (const e of w.exercises) if (e.exId === exId) for (const s of e.sets) b = Math.max(b, e1rm(s.w, s.r));
  return b;
}
const wVolume = w => w.exercises.reduce((a, e) => a + e.sets.reduce((b, s) => b + s.w * s.r, 0), 0);

/* ---------- this session vs last time ---------- */
const exVol = e => e.sets.reduce((a, s) => a + s.w * s.r, 0);
const exReps = e => e.sets.reduce((a, s) => a + s.r, 0);
const wSets = w => w.exercises.reduce((a, e) => a + e.sets.length, 0);
const wReps = w => w.exercises.reduce((a, e) => a + exReps(e), 0);
const before = w => sorted().filter(x => x.id !== w.id && x.start < w.start);
// The last time this same plan was done (or a workout with the same name, for ones started empty)
const lastSession = w => before(w).find(x => w.planId ? x.planId === w.planId : x.name.trim().toLowerCase() === w.name.trim().toLowerCase());
// Each exercise is compared with the last time you did that exercise, whichever day it was on
const lastEx = (exId, w) => { for (const x of before(w)) { const e = x.exercises.find(e => e.exId === exId); if (e) return e; } return null; };
const signed = (d, dp) => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(dp ? r1(d) : Math.round(d)).toLocaleString();
function dTxt(now, was, u, sep = ' · ') {
  if (!was) return '';
  const d = now - was, p = d / was * 100;
  if (Math.abs(p) < 0.05) return `<span class="lower">same as last time</span>`;
  return `<span class="${d > 0 ? 'better' : 'lower'}">${d > 0 ? '▲' : '▼'} ${signed(d)}${u ? ' ' + u : ''}${sep}${signed(p, 1)}%</span>`;
}
function compareHTML(w) {
  const prev = lastSession(w);
  const rows = w.exercises.map(e => {
    const p = lastEx(e.exId, w); if (!p) return { e, p };
    const reps = !exVol(e) && !exVol(p); // bodyweight work: compare reps instead of volume
    return { e, p, now: reps ? exReps(e) : exVol(e), was: reps ? exReps(p) : exVol(p), u: reps ? 'reps' : unit() };
  });
  let head = !prev && !rows.some(r => r.p) ? `<div class="cmp-head flat"><div class="big">First time 🎯</div><div class="muted sm" style="margin-top:4px">This session is the baseline. Next time you'll see exactly how much you beat it.</div></div>` : '';
  if (prev) {
    const v = wVolume(w), pv = wVolume(prev), pct = pv ? (v - pv) / pv * 100 : 0;
    const up = pct >= 0.05, down = pct <= -0.05;
    head = `<div class="cmp-head ${up ? '' : 'flat'}">
      <div class="muted xs">vs last ${esc(prev.name)} · ${nice(prev.start)}</div>
      <div class="big" style="margin-top:4px">${up ? `🔥 ${signed(v - pv)} ${unit()} more · ${signed(pct, 1)}%` : down ? `${Math.abs(r1(pct))}% under last time` : 'Matched last time'}</div>
      <div class="muted sm" style="margin-top:2px">${up ? 'Total weight moved went up. Keep stacking it.' : down ? 'Lighter day — fine as long as the trend goes up.' : 'Same total weight moved. Add a rep next time.'}</div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="v">${Math.round(v).toLocaleString()}</div><div class="l">${unit()} volume</div><div class="d">${dTxt(v, pv, '', '<br>')}</div></div>
      <div class="tile"><div class="v">${wSets(w)}</div><div class="l">Sets</div><div class="d">${dTxt(wSets(w), wSets(prev), '', '<br>')}</div></div>
      <div class="tile"><div class="v">${wReps(w)}</div><div class="l">Reps</div><div class="d">${dTxt(wReps(w), wReps(prev), '', '<br>')}</div></div>
    </div>`;
  }
  const list = rows.map(({ e, p, now, was, u }) => `<div class="cmp-ex"><div style="min-width:0"><div class="n ellip">${esc(e.name)}</div>
      <div class="x ellip">${p ? `${p.sets.map(s => `${s.w}×${s.r}`).join(', ')} → <b style="color:var(--text)">${e.sets.map(s => `${s.w}×${s.r}`).join(', ')}</b>` : e.sets.map(s => `${s.w}×${s.r}`).join(', ')}</div></div>
      <div class="r">${p ? `${signed(now - was)} ${u}<small>${was ? `<span class="${now > was ? 'better' : 'lower'}">${signed((now - was) / was * 100, 1)}%</span>` : ''}</small>` : '<span class="better">New</span>'}</div></div>`).join('');
  return head + `<h2 style="margin:18px 2px 4px">Exercise by exercise</h2><div>${list}</div>`;
}

function viewProgress() {
  const ws = sorted();
  if (!ws.length) return `<h2 style="margin-top:6px">Progress</h2><div class="card empty">Finish your first workout and your charts will show up here.</div>`;
  const total = ws.reduce((a, w) => a + wVolume(w), 0);
  const avgMin = ws.reduce((a, w) => a + (w.end - w.start), 0) / ws.length / 6e4;
  const wk = weekStart(Date.now());
  const weeks = Array.from({ length: 8 }, (_, k) => { const t = wk - (7 - k) * 7 * 864e5; return { x: short(t), y: ws.filter(w => w.start >= t && w.start < t + 7 * 864e5).reduce((a, w) => a + wVolume(w), 0) }; });
  const used = [...new Set(ws.flatMap(w => w.exercises.map(e => e.exId)))];
  if (!used.includes(progEx)) progEx = used[0];
  const pts = [...ws].reverse().map(w => { const e = w.exercises.find(x => x.exId === progEx); return e && { x: short(w.start), y: r1(Math.max(...e.sets.map(s => e1rm(s.w, s.r)))) }; }).filter(Boolean);
  let best = null; ws.forEach(w => w.exercises.forEach(e => { if (e.exId === progEx) e.sets.forEach(s => { if (!best || s.w > best.w || (s.w === best.w && s.r > best.r)) best = { ...s, t: w.start }; }); }));
  const muscle = {}; ws.filter(w => w.start >= wk - 21 * 864e5).forEach(w => w.exercises.forEach(e => muscle[lib(e.exId).muscle] = (muscle[lib(e.exId).muscle] || 0) + e.sets.length));

    ${best ? `<div class="row between sm" style="margin-top:12px"><span class="muted">Best set</span><b>${best.w} ${unit()} × ${best.r} <span class="muted" style="font-weight:400">· ${short(best.t)}</span></b></div>` : ''}
    ${lineChart(pts, v => v + ' ' + unit())}
  </div>
  <h2>Sets per muscle · last 4 weeks</h2>
  <div class="card">${Object.entries(muscle).sort((a, b) => b[1] - a[1]).map(([m, n]) => `

    <div style="height:8px;border-radius:9px;background:var(--card2);margin-top:5px"><div style="height:100%;width:${n / mMax * 100}%;background:var(--acc);border-radius:9px"></div></div></div>`).join('') || '<div class="empty">No sets in the last 4 weeks.</div>'}</div>
  <h2>History</h2>
  <div class="card" style="padding:2px 14px">${ws.map(w => `
    <details class="w"><summary><div><div class="t" style="font-weight:600">${esc(w.name)}</div><div class="muted xs">${nice(w.start)} · ${Math.round((w.end - w.start) / 6e4)} min · ${fmtN(wVolume(w))} ${unit()}</div></div><span class="muted xs">${w.synced ? '✓ sheet' : ''}</span></summary>
      <div class="wd">${compareHTML(w)}

/* ---------- charts ---------- */
function lineChart(pts, fmt) {
  if (pts.length < 2) return `<div class="empty sm">Log at least two entries to see a trend.</div>`;
  const W = 320, H = 150, P = { l: 10, r: 10, t: 22, b: 22 }, C = '#ffd60a';
  const ys = pts.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys), rg = (mx - mn) || 1;
  const X = i => P.l + i * (W - P.l - P.r) / (pts.length - 1), Y = v => P.t + (1 - (v - mn) / rg) * (H - P.t - P.b);
  const d = pts.map((q, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(q.y).toFixed(1)}`).join('');
  const gid = 'g' + uid(), hi = ys.indexOf(mx), lastI = pts.length - 1;
  const hx = Math.min(Math.max(X(hi), 30), W - 30);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C}" stop-opacity=".3"/><stop offset="1" stop-color="${C}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${X(lastI)},${H - P.b}L${X(0)},${H - P.b}Z" fill="url(#${gid})"/>
    <path d="${d}" fill="none" stroke="${C}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((q, i) => `<circle cx="${X(i)}" cy="${Y(q.y)}" r="${i === lastI ? 4.5 : 2.5}" fill="${i === lastI ? C : '#14171c'}" stroke="${C}" stroke-width="2"/>`).join('')}
    <text x="${P.l}" y="${H - 5}" class="ax">${esc(pts[0].x)}</text><text x="${W - P.r}" y="${H - 5}" text-anchor="end" class="ax">${esc(pts[lastI].x)}</text>
    <text x="${hx}" y="${Y(mx) - 9}" text-anchor="middle" class="ax hi">${esc(fmt(mx))}</text>
  </svg>`;
}
function barChart(pts) {
  const W = 320, H = 140, P = { t: 18, b: 22 }, max = Math.max(1, ...pts.map(p => p.y)), bw = W / pts.length;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${pts.map((p, i) => {
    const h = (H - P.t - P.b) * p.y / max, x = i * bw + bw * .18, last = i === pts.length - 1;
    return `<rect x="${x}" y="${H - P.b - Math.max(h, 2)}" width="${bw * .64}" height="${Math.max(h, 2)}" rx="5" fill="${last ? '#ffd60a' : '#2e343d'}"/>
      ${p.y ? `<text x="${x + bw * .32}" y="${H - P.b - h - 5}" text-anchor="middle" class="ax ${last ? 'hi' : ''}">${fmtN(p.y)}</text>` : ''}
      <text x="${x + bw * .32}" y="${H - 6}" text-anchor="middle" class="ax">${esc(p.x)}</text>`; }).join('')}</svg>`;
}

/* ---------- workout actions ---------- */
async function keepAwake(on) {
  try { if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
        if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) {}
}
function startWorkout(planId) {
  if (S.active) { tab = 'workout'; render(); return toast('Finish your current workout first'); }
  const p = S.plans.find(x => x.id === planId);
  S.active = { id: uid(), name: p ? p.name : 'Workout', planId: p ? p.id : '', start: Date.now(),
    exercises: p ? p.items.map(it => ({ exId: it.exId, target: it.reps, showVid: false, sets: Array.from({ length: Math.max(1, +it.sets || 1) }, () => ({ w: '', r: '', done: false })) })) : [] };
  editPlanId = null; tab = 'workout'; save(); render(); keepAwake(true); scrollTo(0, 0);
}
function finishWorkout() {
  const A = S.active;
  const exercises = A.exercises.map(e => ({ exId: e.exId, name: lib(e.exId).name, muscle: lib(e.exId).muscle,
    sets: e.sets.filter(s => s.done).map(s => ({ w: num(s.w), r: Math.round(num(s.r)) })) })).filter(e => e.sets.length);
  if (!exercises.length) return ask('No sets were completed. Discard this workout?', 'Discard', () => { S.active = null; stopRest(); keepAwake(false); save(); render(); });
  const w = { id: A.id, name: A.name || 'Workout', planId: A.planId, start: A.start, end: Date.now(), exercises, notes: '', synced: false };
  const prs = exercises.map(e => { const before = bestE1(e.exId, w.id), now = Math.max(...e.sets.map(s => e1rm(s.w, s.r))); return before && now > before ? { name: e.name, v: r1(now) } : null; }).filter(Boolean);
  S.workouts.push(w); S.active = null; stopRest(); keepAwake(false); save(); render();
  openSheet(`<div style="text-align:center;padding:6px 0 4px"><div style="font-size:44px">💪</div><h3 style="font-size:24px;margin-top:4px">Workout complete</h3><div class="muted sm" style="margin-top:4px">${esc(w.name)} · ${nice(w.start)} · ${Math.round((w.end - w.start) / 6e4)} min</div></div>

/* rest timer */
let audioCtx;
function beep() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.2, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + t + .18); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2); }); } catch (e) {} }
function startRest(sec) { rest = { end: Date.now() + sec * 1000, total: sec }; $('#restbar').classList.remove('hidden'); tick(); }
function stopRest() { rest = null; $('#restbar').classList.add('hidden'); }
function tick() {
  const el = $('#elapsed'); if (el && S.active) el.textContent = fmtDur(Date.now() - S.active.start);
  if (rest) {
    const left = rest.end - Date.now();
    if (left <= 0) { stopRest(); beep(); navigator.vibrate && navigator.vibrate([200, 100, 200]); toast('Rest over — next set!'); return; }
    $('#rbTime').textContent = fmtDur(left + 999);
    $('#rbFill').style.width = (100 - left / (rest.total * 1000) * 100) + '%';
  }
}
setInterval(tick, 1000);

/* ---------- sync with Google Sheets ---------- */
function workoutRows(w) {
  const dur = Math.round((w.end - w.start) / 6e4), time = new Date(w.start).toTimeString().slice(0, 5);
  return w.exercises.flatMap(e => e.sets.map((s, k) => [w.id, ymd(w.start), time, w.name, dur, e.name, e.muscle, k + 1, s.w, unit(), s.r, r1(s.w * s.r), r1(e1rm(s.w, s.r))]));
}
const bodyRow = b => [b.id, b.date, b.weight, unit(), b.bf, b.waist, b.chest, b.arms, b.thighs, lenUnit(), b.notes || ''];
let syncing = false;
async function sync(manual) {
  if (!connected()) { if (manual) toast('Connect your Google Sheet in Settings first'); return; }
  const ws = S.workouts.filter(w => !w.synced), bs = S.body.filter(b => !b.synced), del = [...S.deleted];
  if (!ws.length && !bs.length && !del.length) { if (manual) toast('Everything is already synced ✓'); return; }
  if (syncing) return; syncing = true;
  try {
    await api('sync', { workouts: ws.map(w => ({ id: w.id, rows: workoutRows(w) })), body: bs.map(bodyRow), deleted: del });
    ws.forEach(w => w.synced = true); bs.forEach(b => b.synced = true);
    S.deleted = S.deleted.filter(id => !del.includes(id)); S.settings.lastSync = Date.now(); save();
    toast(`Synced to Google Sheets ✓`);
  } catch (e) { toast(manual ? 'Sync failed — check your internet connection' : 'Saved on this phone — will sync later'); }
  syncing = false; render();
}
window.addEventListener('online', () => sync(false));

/* ---------- export / import ---------- */
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const csv = rows => rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(',')).join('\n');

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, i = +b.dataset.i, j = +b.dataset.j, id = b.dataset.id, A = S.active;
  switch (a) {
    case 'tab': tab = b.dataset.t; editPlanId = null; render(); scrollTo(0, 0); break;
    case 'go-settings': if (tab !== 'settings') backTab = tab; tab = 'settings'; render(); scrollTo(0, 0); break;
    case 'back': tab = backTab; render(); scrollTo(0, 0); break;
    case 'unit': S.settings.unit = b.dataset.v; save(); render(); break;
    case 'rest-step': S.settings.rest = Math.min(600, Math.max(15, (+S.settings.rest || 90) + +b.dataset.d)); save(); render(); break;
    case 'close': closeSheet(); break;
    case 'ask-ok': { const f = askFn; askFn = null; closeSheet(); f && f(); break; }
    case 'start': startWorkout(id); break;
    case 'finish': finishWorkout(); break;
    case 'discard': ask('Discard this workout? Nothing will be saved.', 'Discard', () => { S.active = null; stopRest(); keepAwake(false); save(); render(); }); break;
    case 'done': {
      const e = A.exercises[i], s = e.sets[j], p = prevSets(e.exId)[j], above = e.sets[j - 1];
      s.done = !s.done;
      if (s.done) { // empty fields take last session's numbers, else the set above
        if (s.w === '') s.w = p ? String(p.w) : above && above.w !== '' ? above.w : '0';
        if (s.r === '') s.r = p ? String(p.r) : above && above.r !== '' ? above.r : (String(e.target || '').split('-').pop() || '0');
        navigator.vibrate && navigator.vibrate(25);
        startRest(+S.settings.rest || 90);
      }
      save(); render(); break;
    }
    case 'set-add': { const e = A.exercises[i], last = e.sets[e.sets.length - 1]; e.sets.push({ w: last ? last.w : '', r: last ? last.r : '', done: false }); save(); render(); break; }
    case 'set-rm': A.exercises[i].sets.pop(); save(); render(); break;
    case 'ex-rm': ask(`Remove ${lib(A.exercises[i].exId).name} from this workout?`, 'Remove', () => { A.exercises.splice(i, 1); save(); render(); }); break;
    case 'ex-up': [A.exercises[i - 1], A.exercises[i]] = [A.exercises[i], A.exercises[i - 1]]; save(); render(); break;
    case 'vid': A.exercises[i].showVid = !A.exercises[i].showVid; save(); render(); break;
    case 'rest-add': if (rest) { rest.end += 15000; rest.total += 15; tick(); } break;
    case 'rest-sub': if (rest) { rest.end -= 15000; tick(); } break;
    case 'rest-skip': stopRest(); break;
    case 'pick': openPicker(b.dataset.mode); break;
    case 'pm': picker.m = b.dataset.m; renderPick(); break;
    case 'pick-ex': addToTarget(id); break;
    case 'ex-new': openExEdit(''); break;
    case 'ex-edit': openExEdit(id); break;
    case 'ex-save': {
      const name = $('#exn').value.trim(); if (!name) return toast('Give it a name');
      let ex = id && S.library.find(e => e.id === id);
      if (!ex) { ex = { id: uid() }; S.library.push(ex); }
      Object.assign(ex, { name, muscle: $('#exm').value, video: $('#exv').value.trim() });
      save();
      if (!id && picker) addToTarget(ex.id); else { closeSheet(); render(); toast('Saved'); }
      break;
    }
    case 'ex-del':
      if (A && A.exercises.some(e => e.exId === id)) return toast('It is in your current workout');
      ask('Delete this exercise from your library and plans? Past workouts keep their history.', 'Delete', () => {
        S.library = S.library.filter(e => e.id !== id); S.plans.forEach(p => p.items = p.items.filter(it => it.exId !== id)); save(); render();
      }); break;
    case 'plan-new': { const p = { id: uid(), name: 'New plan', items: [] }; S.plans.push(p); editPlanId = p.id; save(); render(); setTimeout(() => { const t = $('[data-plan-name]'); t && t.select(); }, 50); break; }
    case 'plan-edit': editPlanId = id; tab = 'plans'; render(); scrollTo(0, 0); break;
    case 'plan-back': editPlanId = null; render(); break;
    case 'plan-del': ask('Delete this plan?', 'Delete', () => { S.plans = S.plans.filter(p => p.id !== editPlanId); editPlanId = null; save(); render(); }); break;
    case 'pi-up': { const it = S.plans.find(p => p.id === editPlanId).items, k = +b.dataset.k; [it[k - 1], it[k]] = [it[k], it[k - 1]]; save(); render(); break; }
    case 'pi-rm': S.plans.find(p => p.id === editPlanId).items.splice(+b.dataset.k, 1); save(); render(); break;
    case 'notes-save': { const w = S.workouts.find(x => x.id === id), n = $('#wnotes').value.trim(); if (w && n) { w.notes = n; w.synced = false; save(); if (S.settings.autoSync) sync(false); } closeSheet(); tab = 'progress'; render(); break; }
    case 'w-del': ask('Delete this workout permanently?', 'Delete', () => { S.workouts = S.workouts.filter(w => w.id !== id); S.deleted.push(id); save(); render(); sync(false); }); break;
    case 'bm': bodyMetric = b.dataset.k; render(); break;
    case 'body-save': {
      const e = { id: uid(), date: $('#b_date').value || ymd(Date.now()), notes: $('#b_notes').value.trim(), synced: false };
      let any = false; BODY_F().forEach(([k]) => { const v = $('#b_' + k).value.trim(); e[k] = v === '' ? '' : num(v); if (v !== '') any = true; });
      if (!any) return toast('Enter at least one measurement');
      S.body.push(e); save(); render(); toast('Body stats saved'); if (S.settings.autoSync) sync(false); break;
    }
    case 'b-del': ask('Delete this body-stats entry?', 'Delete', () => { S.body = S.body.filter(x => x.id !== id); S.deleted.push(id); save(); render(); sync(false); }); break;
    case 'sync': sync(true); break;
    case 'connect': {
      const k = $('#apikey').value.trim().toLowerCase(); if (!k) return toast('Enter your private key');
      b.disabled = true; b.textContent = 'Connecting…';
      api('ping', null, k).then(async () => {
        apiKey = k; try { localStorage.setItem(KEY_STORE, k); } catch (e) {}
        await pullCloud(true).catch(() => {}); // the Sheet's copy wins on a newly connected device
        render(); toast('Connected to your Google Sheet ✓'); sync(false);
      }).catch(e => { b.disabled = false; b.textContent = 'Connect'; toast(e.message === 'wrong key' ? 'That key is not right. Check it and try again.' : 'Could not reach Google. Check your internet.'); });
      break;
    }
    case 'disconnect': ask('Disconnect this device from your Google Sheet? Everything already in the Sheet stays there.', 'Disconnect', () => {
      apiKey = ''; cloudReady = false; try { localStorage.removeItem(KEY_STORE); } catch (e) {} render();
    }); break;
    case 'export-json': download(`sanskaar-gym-backup-${ymd(Date.now())}.json`, JSON.stringify(S, null, 2), 'application/json'); break;
    case 'import-json': $('#importFile').click(); break;
    case 'export-csv': download(`sanskaar-gym-workouts-${ymd(Date.now())}.csv`, csv([['Workout ID','Date','Start','Workout','Duration (min)','Exercise','Muscle','Set','Weight','Unit','Reps','Volume','Est. 1RM'], ...sorted().reverse().flatMap(workoutRows)]), 'text/csv'); break;
    case 'reset': ask(connected() ? 'Reset this device? Your plans, workouts and body stats on this phone are cleared, and the Sheet will be overwritten with the empty copy. Save a backup first if you are not sure.'
      : 'Reset this device? Your plans, workouts and body stats on this phone are cleared. Save a backup first if you are not sure.', 'Reset', () => { S = seed(); save(); tab = 'workout'; render(); }); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target, d = t.dataset;
  if (d.f && S.active) { S.active.exercises[+d.i].sets[+d.j][d.f] = t.value; save(); const ws = $('#wsum'); if (ws) ws.textContent = summaryText(); }
  else if ('actName' in d && S.active) { S.active.name = t.value; save(); }
  else if ('planName' in d) { S.plans.find(p => p.id === editPlanId).name = t.value; save(); }
  else if (d.pf) { const it = S.plans.find(p => p.id === editPlanId).items[+d.pi]; it[d.pf] = d.pf === 'sets' ? Math.max(1, parseInt(t.value) || 1) : t.value; save(); }
  else if (t.id === 'pq' && picker) { picker.q = t.value; renderPick(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset;
  if (d.vid) { const ex = S.library.find(e => e.id === d.vid); if (ex) { ex.video = t.value.trim(); save(); render(); if (t.value && !ytId(t.value)) toast("That doesn't look like a YouTube link"); } }
  else if (d.set) { S.settings[d.set] = t.type === 'checkbox' ? t.checked : t.value.trim(); save(); render(); }
  else if ('progEx' in d) { progEx = t.value; render(); }
});
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.library || !d.workouts) throw 0; ask('Replace your current data with this backup?', 'Restore', () => { S = Object.assign(seed(), d); save(); render(); toast('Backup restored'); }); }
  catch (e) { toast('That file is not a Sanskaar GYM backup'); }
  ev.target.value = '';
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.active) keepAwake(true);
  if (connected()) pullCloud(false).catch(() => {}); // pick up changes made on another device while this one was in the background
});

render();
if (S.active) keepAwake(true);
// Pick up the Sheet's copy when it is newer (edited on another device, or browser storage was cleared)
if (connected()) pullCloud(false).catch(() => {});
</script>
</body>
